workflows:
  real-madrid-iphone:
    name: Real Madrid iPhone
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.realmadrid.arda
      vars:
        XCODE_PROJECT: "RealMadrid.xcodeproj"
        XCODE_SCHEME: "RealMadrid"
      xcode: latest
    scripts:
      - name: Check Xcode project
        script: |
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Apply signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
